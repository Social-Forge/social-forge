# Runs the APP + workers in containers on top of the base infra stack.
# Always combine with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The app joins the same `social-forge` network as WAHA/Postgres/etc., so
# service names (postgres, redis, waha-gows, app) resolve internally — no
# host.docker.internal needed. Browser-facing URLs stay on localhost.
#
# Optional extras (off by default so a plain `up` works on any machine):
#   --profile proxy       → Nginx TLS reverse proxy (needs certs; for servers)
#   --profile monitoring  → Postgres/Redis Prometheus exporters

# Shared config for the app + every worker (same image, same env).
x-app: &app
  image: socialforge/app:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  # These OVERRIDE .env so the containerised app talks to services by name.
  environment: &app-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3333'
    LOG_LEVEL: info
    APP_URL: http://localhost:3333 # browser-facing
    DB_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
    TYPESENSE_HOST: typesense
    CENTRIFUGO_URL: http://centrifugo:8000 # app → centrifugo (internal)
    CENTRIFUGO_WS_URL: ws://localhost:8000/connection/websocket # browser → centrifugo (host)
    WAHA_WEBHOOK_BASE_URL: http://app:3333 # WAHA → app (internal, same network)
    WAHA_GOWS_URL: http://waha-gows:3000
    WAHA_NOWEB_URL: http://waha-noweb:3000
    WAHA_WEBJS_URL: http://waha-webjs:3000
    MINIO_SERVER_URL: http://minio:9000
  restart: unless-stopped
  networks: [social-forge]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    rabbitmq: { condition: service_started }

services:
  # Web server — runs migrations on boot, then serves HTTP.
  app:
    <<: *app
    container_name: socialforge-app
    command: sh -c "node ace migration:run --force && node bin/server.js"
    ports:
      - '3333:3333'

  worker-inbound:
    <<: *app
    container_name: socialforge-worker-inbound
    command: node ace worker:inbound
  worker-outbound:
    <<: *app
    container_name: socialforge-worker-outbound
    command: node ace worker:outbound
  worker-ai:
    <<: *app
    container_name: socialforge-worker-ai
    command: node ace worker:ai
  worker-media:
    <<: *app
    container_name: socialforge-worker-media
    command: node ace worker:media
  worker-search:
    <<: *app
    container_name: socialforge-worker-search
    command: node ace worker:search

  # --- Optional: TLS reverse proxy (servers only) --------------------------
  nginx:
    profiles: [proxy]
    image: nginx:1.27-alpine
    container_name: socialforge-nginx
    restart: unless-stopped
    depends_on: [app, centrifugo]
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx/socialforge.conf:/etc/nginx/conf.d/socialforge.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [social-forge]

  # --- Optional: Prometheus exporters --------------------------------------
  postgres-exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:latest
    container_name: socialforge-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-social_forge}?sslmode=disable'
    depends_on: [postgres]
    networks: [social-forge]
  redis-exporter:
    profiles: [monitoring]
    image: oliver006/redis_exporter:latest
    container_name: socialforge-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: 'redis://redis:6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
    depends_on: [redis]
    networks: [social-forge]
