# Prometheus scrape configuration for Social Forge.
# Mount at /etc/prometheus/prometheus.yml. The app exposes /metrics via
# @julr/adonisjs-prometheus (config/prometheus.ts). Restrict access with that
# package's ipsWhitelist and/or the Nginx edge allow-list — Prometheus reaches
# the app over the internal Docker network below.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: socialforge-app
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['app:3333']
        labels:
          service: socialforge

  # Infra exporters (enable the corresponding containers in docker-compose.prod.yml).
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
